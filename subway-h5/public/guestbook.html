<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>留言板</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f3f5;
    color: #1a1d24;
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    background: #f2f3f5;
    padding-bottom: 40px;
  }
  /* 顶部栏 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #e5e6eb;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .btn-admin {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid #d0d3d9;
    background: #fff;
    color: #4a9eff;
    cursor: pointer;
  }
  .btn-admin.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }
  /* 提交区 */
  .composer {
    background: #fff;
    margin: 12px;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .composer .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .composer input.name {
    flex: 1;
    border: 1px solid #e5e6eb;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    outline: none;
  }
  .composer textarea {
    width: 100%;
    border: 1px solid #e5e6eb;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    outline: none;
    resize: vertical;
    min-height: 72px;
    font-family: inherit;
  }
  .composer .actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .btn-submit {
    background: #ff8200;
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-submit:disabled { opacity: 0.6; }
  /* 管理态视图切换 */
  .admin-bar {
    display: flex;
    gap: 6px;
    margin: 0 12px 8px;
    flex-wrap: wrap;
  }
  .seg {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid #e5e6eb;
    background: #fff;
    cursor: pointer;
    color: #5f6368;
  }
  .seg.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }
  /* 列表 */
  .feed { margin: 0 12px; }
  .card {
    display: flex;
    gap: 10px;
    background: #f7f8fa;
    border: 1px solid #eceef1;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    transition: background 0.15s;
  }
  .card:hover { background: #f0f2f5; }
  .avatar {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    user-select: none;
  }
  .card-main { flex: 1; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nickname { font-weight: 700; font-size: 14.5px; }
  .time { font-size: 12px; color: #9aa0a6; }
  .badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .badge.pending { background: #fff4e6; color: #d4860b; }
  .badge.rejected { background: #fde8e8; color: #c0392b; }
  .badge.approved { background: #e6f7ee; color: #1a9e5b; }
  .content {
    margin: 5px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
  }
  .card-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .mini-btn {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid #d0d3d9;
    background: #fff;
    color: #5f6368;
    cursor: pointer;
  }
  .mini-btn.del { color: #c0392b; border-color: #f0c5c0; }
  .mini-btn.ok { color: #1a9e5b; border-color: #b6e3c8; }
  .mini-btn.rej { color: #d4860b; border-color: #f0d9a8; }
  .empty, .loading { text-align: center; color: #9aa0a6; font-size: 13.5px; padding: 28px 0; }
  .loadmore {
    display: block;
    width: 100%;
    margin: 6px 0 10px;
    padding: 10px;
    border: 1px solid #e5e6eb;
    border-radius: 10px;
    background: #fff;
    color: #4a9eff;
    font-size: 14px;
    cursor: pointer;
  }
  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13.5px;
    z-index: 9999;
    max-width: 80%;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  /* 密码弹窗 */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 24px;
  }
  .dialog {
    width: 100%;
    max-width: 320px;
    background: #fff;
    border-radius: 14px;
    padding: 18px;
  }
  .dialog h3 { margin: 0 0 12px; font-size: 16px; }
  .dialog input {
    width: 100%;
    border: 1px solid #e5e6eb;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  .dialog .d-actions { display: flex; gap: 8px; }
  .dialog .d-actions button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 9px 0;
    font-size: 14px;
    cursor: pointer;
  }
  .d-cancel { background: #f0f2f5; color: #5f6368; }
  .d-ok { background: #4a9eff; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>留言板</h1>
    <div class="topbar-right">
      <button id="adminBtn" class="btn-admin">管理员</button>
      <a href="/" class="btn-admin" style="text-decoration:none;display:inline-flex;align-items:center;">返回</a>
    </div>
  </div>

  <div class="composer">
    <div class="row">
      <input id="name" class="name" type="text" placeholder="昵称（默认：匿名）" maxlength="20" />
    </div>
    <textarea id="content" placeholder="说点什么吧…"></textarea>
    <div class="actions">
      <button id="submitBtn" class="btn-submit">提交留言</button>
    </div>
  </div>

  <div id="adminBar" class="admin-bar" style="display:none;">
    <span class="seg active" data-view="approved">已通过</span>
    <span class="seg" data-view="pending">待审核</span>
    <span class="seg" data-view="all">全部</span>
  </div>

  <div id="feed" class="feed">
    <div class="loading">加载中…</div>
  </div>

  <button id="loadMore" class="loadmore" style="display:none;">加载更多</button>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  var LIMIT = 20;
  var ADMIN_KEY = 'gb_admin';

  // ---------- 状态 ----------
  var isAdmin = localStorage.getItem(ADMIN_KEY) === '1';
  var adminPwd = '';                 // 仅内存保存，不落 localStorage
  var adminView = 'approved';        // approved | pending | all（仅管理态）

  var approvedList = [];
  var approvedPage = 1;
  var approvedHasMore = false;

  var pendingList = [];
  var pendingPage = 1;
  var pendingHasMore = false;

  var loading = false;

  // ---------- DOM ----------
  var feedEl = document.getElementById('feed');
  var loadMoreEl = document.getElementById('loadMore');
  var nameEl = document.getElementById('name');
  var contentEl = document.getElementById('content');
  var submitBtn = document.getElementById('submitBtn');
  var adminBtn = document.getElementById('adminBtn');
  var adminBar = document.getElementById('adminBar');
  var toastEl = document.getElementById('toast');

  // ---------- 工具 ----------
  function getClientId() {
    var id = localStorage.getItem('gb_client_id');
    if (!id) {
      try { id = crypto.randomUUID(); } catch (e) {
        id = 'c-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }
      localStorage.setItem('gb_client_id', id);
    }
    return id;
  }
  var MY_ID = getClientId();

  function relTime(iso) {
    var d = new Date(iso).getTime();
    if (isNaN(d)) return '';
    var diff = Math.floor((Date.now() - d) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + '天前';
    var dt = new Date(d);
    return dt.getFullYear() + '-' +
      String(dt.getMonth() + 1).padStart(2, '0') + '-' +
      String(dt.getDate()).padStart(2, '0');
  }

  function avatarColor(name) {
    var h = 0;
    var s = (name || '匿');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return 'hsl(' + h + ', 58%, 52%)';
  }
  function avatarText(name) {
    var t = (name || '匿').trim();
    return t ? t.charAt(0) : '匿';
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function statusLabel(s) {
    if (s === 'pending') return '待审核';
    if (s === 'rejected') return '已拒绝';
    if (s === 'approved') return '已通过';
    return s;
  }

  // ---------- 数据获取 ----------
  function fetchMessages(status, page) {
    var url = '/api/messages?status=' + encodeURIComponent(status) +
      '&page=' + page + '&limit=' + LIMIT;
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('网络错误 ' + res.status);
      return res.json();
    });
  }

  function loadInitial() {
    loading = true;
    feedEl.innerHTML = '<div class="loading">加载中…</div>';
    approvedPage = 1;
    pendingPage = 1;
    var p1 = fetchMessages('approved', 1).then(function (data) {
      approvedList = data.list || [];
      var total = data.total || 0;
      approvedHasMore = approvedList.length < total;
    });
    var p2 = fetchMessages('pending', 1).then(function (data) {
      pendingList = data.list || [];
      var total = data.total || 0;
      pendingHasMore = pendingList.length < total;
    }).catch(function () { pendingList = []; });
    Promise.all([p1, p2]).then(function () {
      loading = false;
      render();
    }).catch(function (err) {
      loading = false;
      feedEl.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) +
        '<br/>请确认后端服务已启动。</div>';
    });
  }

  function loadMore() {
    if (loading) return;
    // 管理态下查看 pending 时，翻页加载 pending；其余翻页加载 approved
    var usePending = isAdmin && adminView === 'pending';
    if (usePending && !pendingHasMore) return;
    if (!usePending && !approvedHasMore) return;

    loading = true;
    var nextPage = usePending ? pendingPage + 1 : approvedPage + 1;
    var status = usePending ? 'pending' : 'approved';
    fetchMessages(status, nextPage).then(function (data) {
      var list = data.list || [];
      if (usePending) {
        pendingList = pendingList.concat(list);
        pendingPage = nextPage;
        pendingHasMore = pendingList.length < (data.total || 0);
      } else {
        approvedList = approvedList.concat(list);
        approvedPage = nextPage;
        approvedHasMore = approvedList.length < (data.total || 0);
      }
      loading = false;
      render();
    }).catch(function (err) {
      loading = false;
      toast('加载失败：' + err.message);
    });
  }

  // ---------- 渲染 ----------
  function mergeDedup(a, b) {
    var seen = {};
    var out = [];
    a.concat(b).forEach(function (m) {
      if (m && m.id != null && !seen[m.id]) { seen[m.id] = 1; out.push(m); }
    });
    return out;
  }

  function currentMessages() {
    if (isAdmin) {
      if (adminView === 'pending') return pendingList.slice();
      if (adminView === 'all') return mergeDedup(approvedList, pendingList);
      return approvedList.slice();
    }
    // 游客：已通过 + 自己刚发的待审核
    var mine = pendingList.filter(function (m) { return m.client_id === MY_ID; });
    return mergeDedup(approvedList, mine);
  }

  function render() {
    var msgs = currentMessages().sort(function (a, b) {
      return new Date(b.created_at) - new Date(a.created_at);
    });

    if (!msgs.length) {
      feedEl.innerHTML = '<div class="empty">还没有留言，快来抢沙发吧～</div>';
      updateLoadMore();
      return;
    }

    var html = '';
    msgs.forEach(function (m) {
      var canDelete = (m.client_id === MY_ID) || isAdmin;
      var color = avatarColor(m.name);
      html += '<div class="card" data-id="' + escapeHtml(m.id) + '">';
      html += '<div class="avatar" style="background:' + color + '">' + escapeHtml(avatarText(m.name)) + '</div>';
      html += '<div class="card-main">';
      html += '<div class="card-head">';
      html += '<span class="nickname">' + escapeHtml(m.name || '匿名') + '</span>';
      html += '<span class="time">' + escapeHtml(relTime(m.created_at)) + '</span>';
      if (m.status && m.status !== 'approved') {
        html += '<span class="badge ' + m.status + '">' + statusLabel(m.status) + '</span>';
      }
      html += '</div>';
      html += '<div class="content">' + escapeHtml(m.content) + '</div>';
      html += '<div class="card-actions">';
      if (canDelete) {
        html += '<button class="mini-btn del" data-action="delete">删除</button>';
      }
      if (isAdmin && m.status !== 'approved') {
        html += '<button class="mini-btn ok" data-action="approve">通过</button>';
      }
      if (isAdmin && m.status !== 'rejected') {
        html += '<button class="mini-btn rej" data-action="reject">拒绝</button>';
      }
      html += '</div>';
      html += '</div></div>';
    });
    feedEl.innerHTML = html;
    updateLoadMore();
  }

  function updateLoadMore() {
    var usePending = isAdmin && adminView === 'pending';
    var hasMore = usePending ? pendingHasMore : approvedHasMore;
    loadMoreEl.style.display = hasMore ? 'block' : 'none';
  }

  // ---------- 操作 ----------
  function submitMessage() {
    var name = nameEl.value.trim() || '匿名';
    var content = contentEl.value.trim();
    if (!content) { toast('请输入留言内容'); return; }

    submitBtn.disabled = true;
    fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, content: content, client_id: MY_ID })
    }).then(function (res) {
      if (!res.ok) throw new Error('提交失败 (' + res.status + ')');
      return res.json();
    }).then(function () {
      contentEl.value = '';
      toast('提交成功，等待审核');
      // 刷新：重新拉取，确保看到自己刚发的（pending）
      loadInitial();
    }).catch(function (err) {
      toast('提交失败：' + err.message);
    }).finally(function () {
      submitBtn.disabled = false;
    });
  }

  function deleteMessage(id) {
    var body = isAdmin ? { admin_password: adminPwd } : { client_id: MY_ID };
    fetch('/api/messages/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('删除失败 (' + res.status + ')');
      return res.json();
    }).then(function () {
      toast('已删除');
      loadInitial();
    }).catch(function (err) {
      toast(err.message);
    });
  }

  function setStatus(id, status) {
    fetch('/api/admin/messages/' + encodeURIComponent(id) + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status, admin_password: adminPwd })
    }).then(function (res) {
      if (!res.ok) throw new Error('操作失败 (' + res.status + ')');
      return res.json();
    }).then(function () {
      toast(status === 'approved' ? '已通过' : '已拒绝');
      loadInitial();
    }).catch(function (err) {
      toast(err.message);
    });
  }

  // ---------- 管理态 ----------
  function showPwdDialog() {
    var mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML =
      '<div class="dialog">' +
      '<h3>管理员验证</h3>' +
      '<input type="password" id="pwdInput" placeholder="请输入管理员密码" />' +
      '<div class="d-actions">' +
      '<button class="d-cancel" id="pwdCancel">取消</button>' +
      '<button class="d-ok" id="pwdOk">确定</button>' +
      '</div></div>';
    document.body.appendChild(mask);
    var pwdInput = mask.querySelector('#pwdInput');
    pwdInput.focus();
    function close() { document.body.removeChild(mask); }
    mask.querySelector('#pwdCancel').onclick = close;
    mask.querySelector('#pwdOk').onclick = function () {
      var pwd = pwdInput.value;
      if (!pwd) { toast('请输入密码'); return; }
      fetch('/api/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      }).then(function (res) { return res.json(); }).then(function (data) {
        if (data && data.ok === true) {
          isAdmin = true;
          adminPwd = pwd;
          localStorage.setItem(ADMIN_KEY, '1');
          close();
          applyAdminUI();
          loadInitial();
          toast('已进入管理态');
        } else {
          toast('密码错误');
        }
      }).catch(function (err) {
        toast('验证失败：' + err.message);
      });
    };
  }

  function logoutAdmin() {
    isAdmin = false;
    adminPwd = '';
    localStorage.removeItem(ADMIN_KEY);
    applyAdminUI();
    loadInitial();
    toast('已退出管理态');
  }

  function applyAdminUI() {
    if (isAdmin) {
      adminBtn.textContent = '退出管理';
      adminBtn.classList.add('active');
      adminBar.style.display = 'flex';
    } else {
      adminBtn.textContent = '管理员';
      adminBtn.classList.remove('active');
      adminBar.style.display = 'none';
      adminView = 'approved';
      Array.prototype.forEach.call(adminBar.querySelectorAll('.seg'), function (s) {
        s.classList.toggle('active', s.getAttribute('data-view') === 'approved');
      });
    }
  }

  // ---------- 事件 ----------
  submitBtn.onclick = submitMessage;

  adminBtn.onclick = function () {
    if (isAdmin) logoutAdmin();
    else showPwdDialog();
  };

  adminBar.addEventListener('click', function (e) {
    var seg = e.target.closest('.seg');
    if (!seg) return;
    adminView = seg.getAttribute('data-view');
    Array.prototype.forEach.call(adminBar.querySelectorAll('.seg'), function (s) {
      s.classList.toggle('active', s === seg);
    });
    loadInitial();
  });

  loadMoreEl.onclick = loadMore;

  feedEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.mini-btn');
    if (!btn) return;
    var card = e.target.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if (action === 'delete') {
      if (confirm('确定删除这条留言？')) deleteMessage(id);
    } else if (action === 'approve') {
      setStatus(id, 'approved');
    } else if (action === 'reject') {
      setStatus(id, 'rejected');
    }
  });

  // ---------- 启动 ----------
  applyAdminUI();
  loadInitial();
})();
</script>
</body>
</html>
